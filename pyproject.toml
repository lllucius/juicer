[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "juicer"
version = "2.0.0"
description = "Python controller for the Furman F1500-UPS E via RS-232"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Leland Lucius" }]
requires-python = ">=3.11"
keywords = ["ups", "furman", "serial", "power-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyserial>=3.5",
    "PySide6>=6.6",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
juicer = "juicer.cli:main"

[project.gui-scripts]
juicer-gui = "juicer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
