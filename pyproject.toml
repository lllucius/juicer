[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "juicer"
version = "2.0.0"
description = "Python controller for the Furman F1500-UPS E via RS-232"
readme = "README.md"
license = "MIT"
authors = ["Leland Lucius"]
keywords = ["ups", "furman", "serial", "power-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
packages = [{include = "juicer", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
click = ">=8.1"
pydantic = ">=2.0"
pyserial = ">=3.5"
PySide6 = {version = ">=6.6", optional = true, python = "<3.15"}
pywin32 = {version = ">=306", optional = true}

[tool.poetry.extras]
gui = ["PySide6"]
windows = ["pywin32"]

[tool.poetry.scripts]
juicer = "juicer.cli:main"
juicer-gui = "juicer.gui:main"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.10"
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.4"

[tool.poetry.group.build.dependencies]
pyinstaller = {version = ">=6.0", python = "<3.15"}
pyinstaller-hooks-contrib = {version = ">=2024.0", python = "<3.15"}
poethepoet = ">=0.34"

[tool.poe.tasks]
build-cli = "pyinstaller --clean --noconfirm scripts/juicer_cli.spec"
build-gui = "pyinstaller --clean --noconfirm scripts/juicer_gui.spec"
build-service = "pyinstaller --clean --noconfirm scripts/juicer_service.spec"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySide6 is not installed in all environments; suppress class-subclassing-Any
# and untyped-decorator errors that are benign here (all guarded by _PYSIDE6_AVAILABLE).
module = "juicer.gui"
disable_error_code = ["misc", "untyped-decorator"]

[[tool.mypy.overrides]]
# winreg is a Windows-only stdlib module.  Its typeshed stubs hide all
# attributes behind sys.platform == "win32" guards, so attribute accesses
# (OpenKey, etc.) would raise [attr-defined] on non-Windows.
# Callers already guard execution with _ensure_windows() / platform checks.
module = ["juicer.service"]
disable_error_code = ["attr-defined"]
